          id(cfg_armed) = false;
          id(profile_user_bal_delta).publish_state(x);
          id(profile_status).publish_state("Unsaved profile edits. Press Save Profile.");

# Factory-mode sessions use JBD protocol control commands for entry and exit.
# The ten-register reader sends no EEPROM parameter-write commands.
# The guarded APPLY transaction is the only path that writes configuration values.
# Run factory-mode operations with charging and external loads disconnected.
# Persist only validated draft values; never persist edit authorization or arm state.
