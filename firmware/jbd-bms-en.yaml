            return;
          }
          id(cfg_armed) = false;
          id(profile_user_covp_rel).publish_state(x);
          id(profile_status).publish_state("Unsaved profile edits. Press Save Profile.");
  - platform: template
    id: profile_user_cuvp
    name: "PROFILE User Cell Undervoltage"
    unit_of_measurement: "V"
    entity_category: config
    mode: BOX
