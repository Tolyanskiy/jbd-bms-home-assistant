  - platform: template
    name: "PROFILE Compare Project Custom Draft EEPROM (NO WRITE)"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (id(cfg_busy) || id(ep_busy) || id(all_read_busy)) {
            id(profile_compare_status).publish_state("Wait until the operation finishes");
            return;
          }
          const float project[10] = {${project_povp}f, ${project_povpr}f, ${project_puvp}f, ${project_puvpr}f, ${project_covp}f, ${project_covp_rel}f, ${project_cuvp}f, ${project_cuvp_rel}f, ${project_bal_start}f, ${project_bal_delta}f};
          const float custom[10] = {id(custom_saved_povp), id(custom_saved_povpr), id(custom_saved_puvp), id(custom_saved_puvpr), id(custom_saved_covp), id(custom_saved_covp_rel), id(custom_saved_cuvp), id(custom_saved_cuvp_rel), id(custom_saved_bal_start), id(custom_saved_bal_delta)};
          const float draft[10] = {id(draft_povp).state, id(draft_povpr).state, id(draft_puvp).state, id(draft_puvpr).state, id(draft_covp).state, id(draft_covp_rel).state, id(draft_cuvp).state, id(draft_cuvp_rel).state, id(draft_bal_start).state, id(draft_bal_delta).state};
          const float eeprom[10] = {id(eeprom_pack_ovp).state, id(eeprom_pack_ovpr).state, id(eeprom_pack_uvp).state, id(eeprom_pack_uvpr).state, id(eeprom_covp).state, id(eeprom_covp_rel).state, id(eeprom_cuvp).state, id(eeprom_cuvp_rel).state, id(eeprom_balance_start).state, id(eeprom_balance_window).state};
          int p_diff = 0, c_diff = 0, e_diff = 0;
          for (int i=0; i<10; ++i) {
            if (!std::isfinite(draft[i])) {
              id(profile_compare_status).publish_state("DRAFT contains unavailable values");
              return;
            }
            const float tol = i < 4 ? 0.011f : 0.0011f;
            if (fabsf(project[i]-draft[i]) > tol) p_diff++;
            if (id(custom_profile_saved) && fabsf(custom[i]-draft[i]) > tol) c_diff++;
            if (id(all_read_valid) && std::isfinite(eeprom[i]) && fabsf(eeprom[i]-draft[i]) > tol) e_diff++;
          }
          char msg[200];
          if (!id(all_read_valid) && id(custom_profile_saved)) {
            snprintf(msg, sizeof(msg),
              "Differences vs DRAFT: project %d/10; custom %d/10; EEPROM not read yet",
              p_diff, c_diff);
          } else if (!id(all_read_valid)) {
            snprintf(msg, sizeof(msg),
              "Differences vs DRAFT: project %d/10; custom not saved; EEPROM not read yet",
              p_diff);
          } else if (!id(custom_profile_saved)) {
            snprintf(msg, sizeof(msg),
              "Project/DRAFT: %d differ; EEPROM/DRAFT: %d of 10 differ; custom not saved",
              p_diff, e_diff);
          } else {
            snprintf(msg, sizeof(msg),
              "Differences vs DRAFT: project %d/10; custom %d/10; EEPROM %d/10",
              p_diff, c_diff, e_diff);
          }
          id(profile_compare_status).publish_state(msg);
          ESP_LOGI("jbd_profile", "Profile comparison: project=%d custom=%d eeprom=%d",p_diff,c_diff,e_diff);
  - platform: template
