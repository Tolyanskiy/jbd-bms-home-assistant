    set_action:
      - lambda: |-
          if (id(cfg_busy) || id(ep_busy) || id(all_read_busy) ||
              !std::isfinite(x) || x < 0.010f - 0.0005f ||
              x > 0.040f + 0.0005f ||
              fabsf((x - 0.010f) / 0.005f - roundf((x - 0.010f) / 0.005f)) > 0.015f) {
            id(profile_status).publish_state("Invalid value or another operation is running");
            return;
