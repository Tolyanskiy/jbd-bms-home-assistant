    id: profile_custom_saved_povpr
    name: "PROFILE Custom Saved Pack OVP Recovery"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    entity_category: diagnostic
    lambda: |-
      if (!id(custom_profile_saved)) return NAN;
