          const float lo[10] = {14.000f, 13.400f, 10.000f, 11.100f, 3.500f, 3.350f, 2.500f, 2.900f, 3.300f, 0.010f};
          const float hi[10] = {14.600f, 14.300f, 10.900f, 12.400f, 3.650f, 3.550f, 2.750f, 3.200f, 3.450f, 0.040f};
          const float step[10] = {0.010f, 0.010f, 0.010f, 0.010f, 0.010f, 0.010f, 0.010f, 0.010f, 0.010f, 0.005f};
          bool valid = true;
          for (int i = 0; i < 10; ++i) {
