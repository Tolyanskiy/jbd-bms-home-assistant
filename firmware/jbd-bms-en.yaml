    id: profile_custom_saved_povp
    name: "PROFILE Custom Saved Pack Overvoltage"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    entity_category: diagnostic
    lambda: |-
      if (!id(custom_profile_saved)) return NAN;
      return id(custom_saved_povp);
    update_interval: 10s
