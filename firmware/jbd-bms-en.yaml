# JBD V5.5 - persistent project and custom profiles with independent EEPROM comparison.
# DRAFT values are retained in ESP32 flash only after successful local input validation.
# WARNING: 0x2828 commits & can reset error counts. Do not operate with UPS connected.
substitutions:
  project_povp: "14.60"
  project_povpr: "14.00"
  project_puvp: "10.50"
  project_puvpr: "11.50"
  project_covp: "3.650"
  project_covp_rel: "3.500"
  project_cuvp: "2.550"
  project_cuvp_rel: "3.000"
  project_bal_start: "3.300"
  project_bal_delta: "0.015"

esphome:
  name: jbd-bms
  friendly_name: JBD-BMS
  min_version: 2026.4.0
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Recover only the DRAFT; never change the BMS, unlock or ARM on boot.
          // Validate persisted values in case limits change in a later firmware.
          const bool good =
              std::isfinite(id(saved_covp)) && id(saved_covp)>=3.5f && id(saved_covp)<=3.65f &&
              std::isfinite(id(saved_covp_rel)) && id(saved_covp_rel)>=3.35f && id(saved_covp_rel)<=3.55f &&
              std::isfinite(id(saved_cuvp)) && id(saved_cuvp)>=2.5f && id(saved_cuvp)<=2.75f &&
              std::isfinite(id(saved_cuvp_rel)) && id(saved_cuvp_rel)>=2.9f && id(saved_cuvp_rel)<=3.2f &&
              std::isfinite(id(saved_bal_start)) && id(saved_bal_start)>=3.3f && id(saved_bal_start)<=3.45f &&
              std::isfinite(id(saved_bal_delta)) && id(saved_bal_delta)>=0.010f && id(saved_bal_delta)<=0.040f &&
              std::isfinite(id(saved_povp)) && id(saved_povp)>=14.0f && id(saved_povp)<=14.6f &&
              std::isfinite(id(saved_povpr)) && id(saved_povpr)>=13.4f && id(saved_povpr)<=14.3f &&
              std::isfinite(id(saved_puvp)) && id(saved_puvp)>=10.0f && id(saved_puvp)<=10.9f &&
              std::isfinite(id(saved_puvpr)) && id(saved_puvpr)>=11.1f && id(saved_puvpr)<=12.4f &&
              id(saved_covp) - id(saved_covp_rel) >= 0.049f &&
              id(saved_covp) - id(saved_bal_start) >= 0.049f &&
              id(saved_cuvp_rel) - id(saved_cuvp) >= 0.099f &&
              id(saved_povp) - id(saved_povpr) >= 0.1f &&
              id(saved_puvpr) - id(saved_puvp) >= 0.1f;
          if (!good) {
            ESP_LOGW("jbd_draft", "Invalid restored draft; use safe defaults");
            id(saved_covp) = ${project_covp}f;
            id(saved_covp_rel) = ${project_covp_rel}f;
            id(saved_cuvp) = ${project_cuvp}f;
            id(saved_cuvp_rel) = ${project_cuvp_rel}f;
            id(saved_bal_start) = ${project_bal_start}f;
            id(saved_bal_delta) = ${project_bal_delta}f;
            id(saved_povp) = ${project_povp}f;
            id(saved_povpr) = ${project_povpr}f;
            id(saved_puvp) = ${project_puvp}f;
            id(saved_puvpr) = ${project_puvpr}f;
          }
          id(draft_covp).publish_state(id(saved_covp));
          id(draft_covp_rel).publish_state(id(saved_covp_rel));
          id(draft_cuvp).publish_state(id(saved_cuvp));
          id(draft_cuvp_rel).publish_state(id(saved_cuvp_rel));
          id(draft_bal_start).publish_state(id(saved_bal_start));
          id(draft_bal_delta).publish_state(id(saved_bal_delta));
          id(draft_povp).publish_state(id(saved_povp));
          id(draft_povpr).publish_state(id(saved_povpr));
          id(draft_puvp).publish_state(id(saved_puvp));
          id(draft_puvpr).publish_state(id(saved_puvpr));
          // Validate the persisted custom profile before loading it into the editor.
          const float v[10] = {id(custom_saved_povp), id(custom_saved_povpr), id(custom_saved_puvp), id(custom_saved_puvpr), id(custom_saved_covp), id(custom_saved_covp_rel), id(custom_saved_cuvp), id(custom_saved_cuvp_rel), id(custom_saved_bal_start), id(custom_saved_bal_delta)};
          const float lo[10] = {14.000f, 13.400f, 10.000f, 11.100f, 3.500f, 3.350f, 2.500f, 2.900f, 3.300f, 0.010f};
          const float hi[10] = {14.600f, 14.300f, 10.900f, 12.400f, 3.650f, 3.550f, 2.750f, 3.200f, 3.450f, 0.040f};
          const float step[10] = {0.010f, 0.010f, 0.010f, 0.010f, 0.010f, 0.010f, 0.010f, 0.010f, 0.010f, 0.005f};
          bool valid = true;
          for (int i = 0; i < 10; ++i) {
            if (!std::isfinite(v[i]) || v[i] < lo[i] - 0.0005f || v[i] > hi[i] + 0.0005f ||
                fabsf((v[i] - lo[i]) / step[i] - roundf((v[i] - lo[i]) / step[i])) > 0.015f) valid = false;
          }
          if (v[0] - v[1] < 0.19f || v[3] - v[2] < 0.29f ||
              v[4] - v[5] < 0.049f || v[4] - v[8] < 0.049f ||
              v[7] - v[6] < 0.099f || v[0] > 4.0f*v[4] + 0.01f ||
              v[2] < 4.0f*v[6] - 0.01f) valid = false;
          if (id(custom_profile_saved) && !valid) {
            id(custom_profile_saved) = false;
            ESP_LOGW("jbd_profile", "Saved custom profile was invalidated by current limits");
          }
          id(profile_user_povp).publish_state(id(custom_profile_saved) ? id(custom_saved_povp) : ${project_povp}f);
          id(profile_user_povpr).publish_state(id(custom_profile_saved) ? id(custom_saved_povpr) : ${project_povpr}f);
          id(profile_user_puvp).publish_state(id(custom_profile_saved) ? id(custom_saved_puvp) : ${project_puvp}f);
          id(profile_user_puvpr).publish_state(id(custom_profile_saved) ? id(custom_saved_puvpr) : ${project_puvpr}f);
          id(profile_user_covp).publish_state(id(custom_profile_saved) ? id(custom_saved_covp) : ${project_covp}f);
          id(profile_user_covp_rel).publish_state(id(custom_profile_saved) ? id(custom_saved_covp_rel) : ${project_covp_rel}f);
          id(profile_user_cuvp).publish_state(id(custom_profile_saved) ? id(custom_saved_cuvp) : ${project_cuvp}f);
          id(profile_user_cuvp_rel).publish_state(id(custom_profile_saved) ? id(custom_saved_cuvp_rel) : ${project_cuvp_rel}f);
          id(profile_user_bal_start).publish_state(id(custom_profile_saved) ? id(custom_saved_bal_start) : ${project_bal_start}f);
          id(profile_user_bal_delta).publish_state(id(custom_profile_saved) ? id(custom_saved_bal_delta) : ${project_bal_delta}f);
          id(profile_status).publish_state(id(custom_profile_saved) ?
            "Custom profile loaded from ESP32 storage" :
            "Custom profile has not been saved yet");
          id(profile_compare_status).publish_state("Comparison has not been run");
          id(cfg_unlock) = false;
          id(cfg_armed) = false;
          id(all_read_valid) = false;
          id(all_read_status).publish_state("Read all ten EEPROM parameters to start comparison");
          ESP_LOGI("jbd_draft", "Stored draft restored, editing LOCKED");

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

# Batch preference changes to reduce flash wear.
preferences:
  flash_write_interval: 15s

# USB diagnostics
logger:
  level: WARN
  hardware_uart: USB_SERIAL_JTAG

# Home Assistant API (existing secret retained)
api:
  encryption:
    key: !secret jbd_bms__encryption_key

# OTA (unchanged from working configuration)
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://syssi/esphome-jbd-bms@main

# Working JBD DP04S007 V2.1 UART connection
uart:
  id: jbd_uart
  tx_pin: GPIO4
  rx_pin: GPIO5
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  # Passive RX observer. All UART traffic is still handled by syssi.
  debug:
    direction: RX
    after:
      timeout: 40ms
    sequence:
      - lambda: |-
          // JBD reply: DD REG STATUS LEN PAYLOAD CHECKSUM_H CHECKSUM_L 77.
          static std::vector<uint8_t> buffer;
          if (direction != uart::UART_DIRECTION_RX) return;
          if (buffer.size() + bytes.size() > 512) buffer.clear();
          buffer.insert(buffer.end(), bytes.begin(), bytes.end());
          while (buffer.size() >= 7) {
            if (buffer[0] != 0xDD) { buffer.erase(buffer.begin()); continue; }
            const size_t len = buffer[3];
            if (len > 64) { buffer.erase(buffer.begin()); continue; }
            const size_t total = len + 7;
            if (buffer.size() < total) break;
            if (buffer[total-1] != 0x77) { buffer.erase(buffer.begin()); continue; }
            uint16_t check = 0;
            for (size_t i = 2; i < 4 + len; ++i) check -= buffer[i];
            const uint16_t got = ((uint16_t)buffer[total-3] << 8) | buffer[total-2];
            if (got != check) {
              ESP_LOGW("jbd_eeprom", "Bad response checksum");
              buffer.erase(buffer.begin(), buffer.begin() + total);
              continue;
            }
            const uint8_t reg = buffer[1];
            const uint8_t result = buffer[2];
            // Route the independent ten-register reader before the six-register monitor.
            if (id(all_read_busy) && id(all_read_phase) == 1 && reg == id(all_read_expected)) {
              if (result != 0) {
                id(all_read_ack) = -int(result);
              } else if (len == 2) {
                id(all_read_value) = (uint16_t(buffer[4]) << 8) | buffer[5];
                id(all_read_ack) = 1;
              } else {
                id(all_read_ack) = -99;
              }
              id(all_read_phase) = 0;
            }
            if (id(cfg_busy) && id(cfg_phase) != 0 && reg == id(cfg_expected)) {
              // A read ACK must carry two bytes. A write ACK must carry zero bytes.
              if (result != 0) {
                id(cfg_ack) = -int(result);
              } else if (id(cfg_phase) == 1 && len == 2) {
                id(cfg_rx_value) = (uint16_t(buffer[4]) << 8) | buffer[5];
                id(cfg_ack) = 1;
              } else if (id(cfg_phase) == 2 && len == 0) {
                id(cfg_ack) = 1;
              } else {
                id(cfg_ack) = -99;
              }
              id(cfg_phase) = 0;
            }
            if (id(ep_busy) && reg == 0x00) {
              id(ep_entry) = (result == 0) ? 1 : -(int) result;
              ESP_LOGI("jbd_eeprom", "Factory enter reply: 0x%02X", result);
            } else if (id(ep_busy) && reg == 0x01) {
              id(ep_exit) = (result == 0) ? 1 : -(int) result;
              ESP_LOGI("jbd_eeprom", "Factory exit reply: 0x%02X", result);
            } else if (id(ep_busy) && !id(cfg_busy) && !id(all_read_busy) &&
                       (reg == 0x24 || reg == 0x25 || reg == 0x26 ||
                        reg == 0x27 || reg == 0x2A || reg == 0x2B)) {
              int bit = (reg == 0x24) ? 0 : (reg == 0x25) ? 1 :
                        (reg == 0x26) ? 2 : (reg == 0x27) ? 3 :
                        (reg == 0x2A) ? 4 : 5;
              if (result != 0) {
                id(ep_errors)++;
                ESP_LOGW("jbd_eeprom", "Register 0x%02X rejected: 0x%02X", reg, result);
              } else if (len != 2) {
                id(ep_errors)++;
                ESP_LOGW("jbd_eeprom", "Register 0x%02X length %u (expected 2)",
                         reg, (unsigned)len);
              } else {
                const uint16_t millivolts = ((uint16_t)buffer[4] << 8) | buffer[5];
                // Tight basic plausibility checks. Never publish a suspicious value.
                const bool valid = (reg == 0x2B) ?
                    (millivolts >= 1 && millivolts <= 1000) :
                    (millivolts >= 1000 && millivolts <= 4500);
                if (valid) {
                  const float volts = millivolts / 1000.0f;
                  switch (reg) {
                    case 0x24: id(eeprom_covp).publish_state(volts); break;
                    case 0x25: id(eeprom_covp_rel).publish_state(volts); break;
                    case 0x26: id(eeprom_cuvp).publish_state(volts); break;
                    case 0x27: id(eeprom_cuvp_rel).publish_state(volts); break;
                    case 0x2A: id(eeprom_balance_start).publish_state(volts); break;
                    case 0x2B: id(eeprom_balance_window).publish_state(volts); break;
                  }
                  id(ep_mask) |= (1 << bit);
                  ESP_LOGI("jbd_eeprom", "Read register 0x%02X: %u mV", reg, millivolts);
                } else {
                  id(ep_errors)++;
                  ESP_LOGW("jbd_eeprom", "Register 0x%02X implausible: %u", reg, millivolts);
                }
              }
            }
            buffer.erase(buffer.begin(), buffer.begin() + total);
          }

jbd_bms:
  id: bms0
  uart_id: jbd_uart
  update_interval: 5s
  rx_timeout: 300ms

sensor:
  - platform: jbd_bms
    jbd_bms_id: bms0

    # Existing measurements
    total_voltage:
      name: "Total Voltage"
    current:
      name: "Current"
      id: bms_measured_current
    power:
      name: "Power"
    state_of_charge:
      name: "SOC"
    cell_voltage_1:
      name: "Cell 1"
    cell_voltage_2:
      name: "Cell 2"
    cell_voltage_3:
      name: "Cell 3"
    cell_voltage_4:
      name: "Cell 4"
    delta_cell_voltage:
      name: "Cell Delta"
      accuracy_decimals: 3
    temperature_1:
      name: "Temperature"

    # Additional data available from normal JBD frames
    nominal_capacity:
      name: "Nominal Capacity"
    capacity_remaining:
      name: "Remaining Capacity"
    battery_cycle_capacity:
      name: "Cycle Capacity"
    charging_cycles:
      name: "Charging Cycles"
    cell_count:
      name: "Cell Count"
    average_cell_voltage:
      name: "Average Cell Voltage"
    min_cell_voltage:
      name: "Minimum Cell Voltage"
    max_cell_voltage:
      name: "Maximum Cell Voltage"
    min_voltage_cell:
      name: "Minimum Voltage Cell Number"
    max_voltage_cell:
      name: "Maximum Voltage Cell Number"
    charging_power:
      name: "Charging Power"
    discharging_power:
      name: "Discharging Power"
    software_version:
      name: "BMS Software Version"

    # Counters are updated after pressing the read-only button below
    short_circuit_error_count:
      name: "Short Circuit Error Count"
    charge_overcurrent_error_count:
      name: "Charge Overcurrent Error Count"
    discharge_overcurrent_error_count:
      name: "Discharge Overcurrent Error Count"
    cell_overvoltage_error_count:
      name: "Cell Overvoltage Error Count"
    cell_undervoltage_error_count:
      name: "Cell Undervoltage Error Count"
    battery_overvoltage_error_count:
      name: "Battery Overvoltage Error Count"
    battery_undervoltage_error_count:
      name: "Battery Undervoltage Error Count"

  # EEPROM configuration readouts. Until successfully queried, state = Unknown.
  - platform: template
    id: eeprom_covp
    name: "EEPROM Cell Overvoltage"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: eeprom_covp_rel
    name: "EEPROM Cell Overvoltage Recovery"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: eeprom_cuvp
    name: "EEPROM Cell Undervoltage"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: eeprom_cuvp_rel
    name: "EEPROM Cell Undervoltage Recovery"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: eeprom_balance_start
    name: "EEPROM Balance Start Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: eeprom_balance_window
    name: "EEPROM Balance Delta"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: never

  # Compare-only diagnostic values: DRAFT minus EEPROM (V).
  # Valid only after explicit EEPROM read and Compare. Never written to BMS.
  - platform: template
    id: cmp_covp
    name: "COMPARE Cell Overvoltage Delta"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: cmp_covp_rel
    name: "COMPARE Cell OVP Recovery Delta"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: cmp_cuvp
    name: "COMPARE Cell Undervoltage Delta"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: cmp_cuvp_rel
    name: "COMPARE Cell UVP Recovery Delta"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: cmp_bal_start
    name: "COMPARE Balance Start Delta"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: cmp_bal_delta
    name: "COMPARE Balance Window Delta"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    entity_category: diagnostic
    update_interval: never

  # Ten-register DRAFT minus EEPROM differences (pack thresholds).
  - platform: template
    id: cmp_povp
    name: "COMPARE Pack Overvoltage Delta"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: cmp_povpr
    name: "COMPARE Pack OVP Recovery Delta"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: cmp_puvp
    name: "COMPARE Pack Undervoltage Delta"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: cmp_puvpr
    name: "COMPARE Pack UVP Recovery Delta"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: never

  # EEPROM Pack threshold readout (10 mV per raw unit).
  - platform: template
    id: eeprom_pack_ovp
    name: "EEPROM Pack Overvoltage"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: never
    entity_category: diagnostic
  - platform: template
    id: eeprom_pack_ovpr
    name: "EEPROM Pack Overvoltage Recovery"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: never
    entity_category: diagnostic
  - platform: template
    id: eeprom_pack_uvp
    name: "EEPROM Pack Undervoltage"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: never
    entity_category: diagnostic
  - platform: template
    id: eeprom_pack_uvpr
    name: "EEPROM Pack Undervoltage Recovery"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    update_interval: never
    entity_category: diagnostic

  # Profile reference values displayed in Home Assistant.
  - platform: template
    id: profile_project_povp
    name: "PROFILE Project Pack Overvoltage"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    entity_category: diagnostic
    lambda: 'return ${project_povp};'
    update_interval: 30s
