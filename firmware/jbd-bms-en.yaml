# Draft input values exist on ESP32; ONLY APPLY after explicit arm may write to BMS.
# BOX requests numeric entry. Non-optimistic: state changes ONLY on validation success.
number:
  - platform: template
    id: draft_covp
    name: "DRAFT Cell Overvoltage (NO WRITE)"
    unit_of_measurement: "V"
    entity_category: config
    mode: BOX
    min_value: 3.500
    max_value: 3.650
    step: 0.010
    optimistic: false
    restore_value: false
    initial_value: '${project_covp}'
    set_action:
      - lambda: |- 
          if (!id(cfg_unlock)) {
            id(draft_validation_status).publish_state("LOCKED - enable config switch first");
            return;
          }
          id(cfg_armed) = false;
          const float eps = 0.0005f;
          const float min_v = 3.500f;
          const float max_v = 3.650f;
          const float step_v = 0.010f;
          const float steps = (x - min_v) / step_v;
          // Do not rely solely on HA: validate all API requests on the ESP.
          if (!std::isfinite(x) || x < min_v - eps || x > max_v + eps ||
              fabsf(steps - roundf(steps)) > 0.01f) {
            id(draft_validation_status).publish_state("REJECTED OVP: outside bounds or step");
            id(draft_covp).publish_state(id(draft_covp).state);
            return;
          }
          if (x + eps < id(draft_covp_rel).state + 0.05f || x + eps < id(draft_bal_start).state + 0.05f) {
            id(draft_validation_status).publish_state("REJECTED: OVP must be >= OVP Recovery + 0.05 V and Balance Start + 0.05 V");
            id(draft_covp).publish_state(id(draft_covp).state);
            return;
          }
          id(draft_covp).publish_state(x);
          id(saved_covp) = x;
          id(draft_validation_status).publish_state("ACCEPTED OVP (DRAFT ONLY; NO WRITE)");
  - platform: template
