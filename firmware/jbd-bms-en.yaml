script:
  - id: eeprom_read_thresholds
    mode: single
    then:
      - lambda: |-
          id(ep_busy) = true;
          id(all_read_valid) = false;
          id(all_read_status).publish_state("Six-register read started; request fresh 10/10 snapshot for full comparison");
          id(ep_entry) = 0;
          id(ep_exit) = 0;
          id(ep_mask) = 0;
          id(ep_errors) = 0;
          id(eeprom_covp).publish_state(NAN);
          id(eeprom_covp_rel).publish_state(NAN);
          id(eeprom_cuvp).publish_state(NAN);
          id(eeprom_cuvp_rel).publish_state(NAN);
          id(eeprom_balance_start).publish_state(NAN);
          id(eeprom_balance_window).publish_state(NAN);
          id(eeprom_status).publish_state("Entering factory mode for READ");
          static const uint8_t enter_code[2] = {0x56, 0x78};
          id(bms0).send_command(0x5A, 0x00, enter_code, 2);
      - wait_until:
          condition:
            lambda: 'return id(ep_entry) != 0;'
          timeout: 3s
      - if:
          condition:
            lambda: 'return id(ep_entry) == 1;'
          then:
            - lambda: |-
                id(eeprom_status).publish_state("Factory mode OK; reading six registers");
                id(bms0).send_command(0xA5, 0x24, nullptr, 0);
            - delay: 350ms
            - lambda: 'id(bms0).send_command(0xA5, 0x25, nullptr, 0);'
            - delay: 350ms
            - lambda: 'id(bms0).send_command(0xA5, 0x26, nullptr, 0);'
            - delay: 350ms
            - lambda: 'id(bms0).send_command(0xA5, 0x27, nullptr, 0);'
            - delay: 350ms
            - lambda: 'id(bms0).send_command(0xA5, 0x2A, nullptr, 0);'
            - delay: 350ms
            - lambda: 'id(bms0).send_command(0xA5, 0x2B, nullptr, 0);'
            - delay: 450ms
          else:
            - lambda: |-
                char s[85];
                snprintf(s, sizeof(s), "Factory mode denied/no response (%d); exiting", id(ep_entry));
                id(eeprom_status).publish_state(s);
                ESP_LOGW("jbd_eeprom", "%s", s);
      # Always attempt non-saving exit even if entry failed or read failed.
      # Never use exit code 28 28 (which can commit/reset counters).
      - lambda: |-
          id(ep_exit) = 0;
          static const uint8_t exit_without_save[2] = {0x00, 0x00};
          id(bms0).send_command(0x5A, 0x01, exit_without_save, 2);
      - wait_until:
          condition:
            lambda: 'return id(ep_exit) != 0;'
          timeout: 3s
      - if:
          condition:
            lambda: 'return id(ep_exit) != 1;'
          then:
            - lambda: |-
                ESP_LOGW("jbd_eeprom", "Exit unconfirmed; retry non-saving exit");
                static const uint8_t exit_without_save[2] = {0x00, 0x00};
                id(ep_exit) = 0;
                id(bms0).send_command(0x5A, 0x01, exit_without_save, 2);
            - wait_until:
                condition:
                  lambda: 'return id(ep_exit) != 0;'
                timeout: 3s
      - lambda: |-
          char s[95];
          if (id(ep_exit) != 1) {
            snprintf(s, sizeof(s), "WARNING: factory exit NOT CONFIRMED (reply %d)", id(ep_exit));
          } else if (id(ep_entry) != 1) {
            snprintf(s, sizeof(s), "Factory enter rejected (%d); exit confirmed", id(ep_entry));
          } else {
            int cnt = __builtin_popcount((unsigned int) id(ep_mask));
            snprintf(s, sizeof(s), "Read %d/6, rejected %d; exit confirmed", cnt, id(ep_errors));
          }
          id(eeprom_status).publish_state(s);
          ESP_LOGI("jbd_eeprom", "%s", s);
          id(ep_busy) = false;

  # An isolated, read-only ten-register session; no EEPROM parameter writes.
  - id: eeprom_read_all_ten
    mode: single
    then:
      - lambda: |-
          id(all_read_busy) = true;
          id(all_read_valid) = false;
          id(all_read_failed) = false;
          id(all_read_phase) = 0;
          id(all_read_expected) = -1;
          id(all_read_ack) = 0;
          id(all_read_step) = 0;
          id(all_read_mask) = 0;
          id(ep_busy) = true;
          id(ep_entry) = 0;
          id(ep_exit) = 0;
          id(ep_mask) = 0;
          id(cmp_povp).publish_state(NAN);
          id(cmp_povpr).publish_state(NAN);
          id(cmp_puvp).publish_state(NAN);
          id(cmp_puvpr).publish_state(NAN);
          id(cmp_covp).publish_state(NAN);
          id(cmp_covp_rel).publish_state(NAN);
          id(cmp_cuvp).publish_state(NAN);
          id(cmp_cuvp_rel).publish_state(NAN);
          id(cmp_bal_start).publish_state(NAN);
          id(cmp_bal_delta).publish_state(NAN);
          id(draft_status).publish_state("READING: new EEPROM snapshot in progress");
          id(all_read_status).publish_state("Entering factory mode for ten-register READ");
          const uint8_t enter_code[2] = {0x56, 0x78};
          id(bms0).send_command(0x5A, 0x00, enter_code, 2);
      - wait_until:
          condition:
            lambda: 'return id(ep_entry) != 0;'
          timeout: 3s
      - if:
          condition:
            lambda: 'return id(ep_entry) == 1;'
          then:
            - repeat:
                count: 10
                then:
                  - if:
                      condition:
                        lambda: 'return !id(all_read_failed);'
                      then:
                        - lambda: |-
                            static const uint8_t regs[10] = {
                              0x20, 0x21, 0x22, 0x23, 0x24, 0x25, 0x26, 0x27, 0x2A, 0x2B
                            };
                            id(all_read_expected) = regs[id(all_read_step)];
                            id(all_read_phase) = 1;
                            id(all_read_ack) = 0;
                            id(bms0).send_command(0xA5, regs[id(all_read_step)], nullptr, 0);
                        - wait_until:
                            condition:
                              lambda: 'return id(all_read_ack) != 0;'
                            timeout: 1500ms
                        - lambda: |-
                            const int index = id(all_read_step);
                            const uint16_t raw = uint16_t(id(all_read_value));
                            const bool credible = (index < 4) ? (raw >= 800 && raw <= 2000) :
                                                  (index == 9) ? (raw >= 1 && raw <= 1000) :
                                                  (raw >= 2000 && raw <= 4500);
                            if (id(all_read_ack) != 1 || !credible) {
                              id(all_read_failed) = true;
                              ESP_LOGW("jbd_read10", "EEPROM read failed: index=%d reg=0x%02X ACK=%d raw=%u",
                                       index, id(all_read_expected), id(all_read_ack), raw);
                            } else {
                              id(all_read_raw)[index] = raw;
                              id(all_read_mask) |= (1 << index);
                              ESP_LOGI("jbd_read10", "EEPROM 0x%02X=%u", id(all_read_expected), raw);
                            }
                            id(all_read_phase) = 0;
                            id(all_read_step)++;
          else:
            - lambda: |-
                id(all_read_failed) = true;
                ESP_LOGW("jbd_read10", "Factory entry failed: %d", id(ep_entry));
      # Always request exit without commit, even when reading failed.
      - lambda: |-
          id(ep_exit) = 0;
          const uint8_t exit_without_save[2] = {0x00, 0x00};
          id(bms0).send_command(0x5A, 0x01, exit_without_save, 2);
      - wait_until:
          condition:
            lambda: 'return id(ep_exit) != 0;'
          timeout: 3s
      - if:
          condition:
            lambda: 'return id(ep_exit) != 1;'
          then:
            - lambda: |-
                id(ep_exit) = 0;
                const uint8_t exit_without_save[2] = {0x00, 0x00};
                id(bms0).send_command(0x5A, 0x01, exit_without_save, 2);
            - wait_until:
                condition:
                  lambda: 'return id(ep_exit) != 0;'
                timeout: 3s
      - lambda: |-
          const bool ok = !id(all_read_failed) && id(ep_entry) == 1 &&
                          id(ep_exit) == 1 && id(all_read_mask) == 0x3FF;
          if (ok) {
            const auto &r = id(all_read_raw);
            id(eeprom_pack_ovp).publish_state(r[0] / 100.0f);
            id(eeprom_pack_ovpr).publish_state(r[1] / 100.0f);
            id(eeprom_pack_uvp).publish_state(r[2] / 100.0f);
            id(eeprom_pack_uvpr).publish_state(r[3] / 100.0f);
            id(eeprom_covp).publish_state(r[4] / 1000.0f);
            id(eeprom_covp_rel).publish_state(r[5] / 1000.0f);
            id(eeprom_cuvp).publish_state(r[6] / 1000.0f);
            id(eeprom_cuvp_rel).publish_state(r[7] / 1000.0f);
            id(eeprom_balance_start).publish_state(r[8] / 1000.0f);
            id(eeprom_balance_window).publish_state(r[9] / 1000.0f);
            id(all_read_valid) = true;
            id(ep_mask) = 0x3F;
            id(all_read_status).publish_state("Read 10/10; exit confirmed; NO WRITE");
            id(eeprom_status).publish_state("Read 10/10; exit confirmed");
            ESP_LOGI("jbd_read10", "All ten EEPROM registers verified (read-only)");
          } else {
            id(all_read_valid) = false;
            id(eeprom_pack_ovp).publish_state(NAN);
            id(eeprom_pack_ovpr).publish_state(NAN);
            id(eeprom_pack_uvp).publish_state(NAN);
            id(eeprom_pack_uvpr).publish_state(NAN);
            id(eeprom_covp).publish_state(NAN);
            id(eeprom_covp_rel).publish_state(NAN);
            id(eeprom_cuvp).publish_state(NAN);
            id(eeprom_cuvp_rel).publish_state(NAN);
            id(eeprom_balance_start).publish_state(NAN);
            id(eeprom_balance_window).publish_state(NAN);
            char status[140];
            snprintf(status, sizeof(status),
              "READ FAILED: %d/10; entry=%d exit=%d; NO WRITE",
              __builtin_popcount((unsigned int) id(all_read_mask)), id(ep_entry), id(ep_exit));
            id(all_read_status).publish_state(status);
            ESP_LOGW("jbd_read10", "%s", status);
          }
          id(all_read_phase) = 0;
          id(all_read_busy) = false;
          id(ep_busy) = false;

  # Stateful guarded apply transaction. Never starts automatically.
  - id: cfg_write_transaction
    mode: single
    then:
      - lambda: |-
          if (!id(cfg_unlock) || !id(cfg_armed) || id(ep_busy) ||
              !id(bms_online_status).state || id(bms_afe_error).state ||
              !std::isfinite(id(bms_measured_current).state) ||
              fabsf(id(bms_measured_current).state) > 0.1f) {
            id(cfg_status).publish_state("REFUSED: locked/unarmed/busy/unsafe BMS state");
            return;
          }
          // Lock immediately; other edits are disallowed throughout the transaction.
          id(cfg_unlock) = false;
          id(cfg_armed) = false;
          id(cfg_busy) = true;
          id(ep_busy) = true;
          id(all_read_valid) = false;
          id(all_read_status).publish_state("Configuration updated; perform fresh ten-register READ");
          id(cfg_failed) = false;
          id(cfg_changed) = 0;
          id(cfg_step) = 0;
          id(ep_entry) = 0;
          id(ep_exit) = 0;
          id(cfg_phase) = 0;
          id(cfg_ack) = 0;
          // Capture DRAFT only when START is pressed, never during boot.
          const float v[10] = {
            id(draft_povp).state, id(draft_povpr).state,
            id(draft_puvp).state, id(draft_puvpr).state,
            id(draft_covp).state, id(draft_covp_rel).state,
            id(draft_cuvp).state, id(draft_cuvp_rel).state,
            id(draft_bal_start).state, id(draft_bal_delta).state
          };
          for (int i=0; i<10; ++i) {
            const float unit = i < 4 ? 100.0f : 1000.0f;
            id(cfg_target)[i] = uint16_t(lroundf(v[i] * unit));
          }
          static const uint8_t key[2] = {0x56, 0x78};
          id(bms0).send_command(0x5A, 0x00, key, 2);
          id(cfg_status).publish_state("Factory mode: entering for pre-write BACKUP");
      - if:
          condition:
            lambda: 'return id(cfg_busy);'
          then:
            - wait_until:
                condition:
                  lambda: 'return id(ep_entry) != 0;'
                timeout: 3s
            - lambda: |-
                if (id(ep_entry) != 1) id(cfg_failed) = true;
            # Read all ten original registers into RAM; fail closed on any error.
            - repeat:
                count: 10
                then:
                  - if:
                      condition:
                        lambda: 'return !id(cfg_failed);'
                      then:
                        - lambda: |-
                            static const uint8_t regs[10] = {0x20,0x21,0x22,0x23,0x24,0x25,0x26,0x27,0x2A,0x2B};
                            id(cfg_expected) = regs[id(cfg_step)];
                            id(cfg_phase) = 1;
                            id(cfg_ack) = 0;
                            id(bms0).send_command(0xA5, regs[id(cfg_step)], nullptr, 0);
                        - wait_until:
                            condition:
                              lambda: 'return id(cfg_ack) != 0;'
                            timeout: 900ms
                        - lambda: |-
                            if (id(cfg_ack) != 1) id(cfg_failed) = true;
                            else {
                              const uint16_t raw = uint16_t(id(cfg_rx_value));
                              const int index = id(cfg_step);
                              const bool credible = (index < 4) ? (raw >= 800 && raw <= 2000) :
                                                    (index == 9) ? (raw >= 1 && raw <= 1000) :
                                                    (raw >= 2000 && raw <= 4500);
                              if (!credible) id(cfg_failed) = true;
                              else id(cfg_original)[index] = raw;
                            }
                            id(cfg_phase) = 0;
                            id(cfg_step)++;
            - if:
                condition:
                  lambda: 'return !id(cfg_failed);'
                then:
                  - lambda: |-
                      char msg[190];
                      snprintf(msg, sizeof(msg),
                        "BACKUP raw 20=%u 21=%u 22=%u 23=%u 24=%u 25=%u 26=%u 27=%u 2A=%u 2B=%u",
                        id(cfg_original)[0], id(cfg_original)[1], id(cfg_original)[2],
                        id(cfg_original)[3], id(cfg_original)[4], id(cfg_original)[5],
                        id(cfg_original)[6], id(cfg_original)[7], id(cfg_original)[8],
                        id(cfg_original)[9]);
                      id(cfg_backup).publish_state(msg);
                      id(cfg_status).publish_state("BACKUP read OK; preparing changed writes");
                      id(cfg_step) = 0;
                  - repeat:
                      count: 10
                      then:
                        - if:
                            condition:
                              lambda: |-
                                return !id(cfg_failed) &&
                                  id(cfg_original)[id(cfg_step)] != id(cfg_target)[id(cfg_step)];
                            then:
                              - lambda: |-
                                  static const uint8_t regs[10] = {0x20,0x21,0x22,0x23,0x24,0x25,0x26,0x27,0x2A,0x2B};
                                  const uint16_t data = id(cfg_target)[id(cfg_step)];
                                  const uint8_t b[2] = {uint8_t(data >> 8), uint8_t(data & 0xFF)};
                                  id(cfg_expected) = regs[id(cfg_step)];
                                  id(cfg_phase) = 2;
                                  id(cfg_ack) = 0;
                                  id(bms0).send_command(0x5A, regs[id(cfg_step)], b, 2);
                              - wait_until:
                                  condition:
                                    lambda: 'return id(cfg_ack) != 0;'
                                  timeout: 900ms
                              - lambda: |-
                                  if (id(cfg_ack) != 1) id(cfg_failed) = true;
                                  else id(cfg_changed)++;
                                  id(cfg_phase) = 0;
                        - lambda: 'id(cfg_step)++;'
            # Commit only if EVERY write ACK succeeded. 28 28 resets error counters.
            - lambda: |-
                id(ep_exit) = 0;
                const bool commit = !id(cfg_failed) && id(cfg_changed) > 0;
                const uint8_t b[2] = {uint8_t(commit ? 0x28 : 0x00), uint8_t(commit ? 0x28 : 0x00)};
                id(bms0).send_command(0x5A, 0x01, b, 2);
                id(cfg_status).publish_state(commit ? "COMMIT requested (historical error counts may reset)" : "No commit; factory exit requested");
            - wait_until:
                condition:
                  lambda: 'return id(ep_exit) != 0;'
                timeout: 3s
            - lambda: |-
                if (id(ep_exit) != 1) id(cfg_failed) = true;
            # If committed, prove persistence by opening fresh factory session.
            - if:
                condition:
                  lambda: 'return !id(cfg_failed) && id(cfg_changed) > 0;'
                then:
                  - delay: 400ms
                  - lambda: |-
                      id(ep_entry) = 0;
                      id(ep_exit) = 0;
                      id(cfg_step) = 0;
                      static const uint8_t key[2] = {0x56, 0x78};
                      id(bms0).send_command(0x5A, 0x00, key, 2);
                      id(cfg_status).publish_state("VERIFY: entering fresh factory session");
                  - wait_until:
                      condition:
                        lambda: 'return id(ep_entry) != 0;'
                      timeout: 3s
                  - lambda: |-
                      if (id(ep_entry) != 1) id(cfg_failed) = true;
                  - repeat:
                      count: 10
                      then:
                        - if:
                            condition:
                              lambda: 'return !id(cfg_failed);'
                            then:
                              - lambda: |-
                                  static const uint8_t regs[10] = {0x20,0x21,0x22,0x23,0x24,0x25,0x26,0x27,0x2A,0x2B};
                                  id(cfg_expected) = regs[id(cfg_step)];
                                  id(cfg_phase) = 1;
                                  id(cfg_ack) = 0;
                                  id(bms0).send_command(0xA5, regs[id(cfg_step)], nullptr, 0);
                              - wait_until:
                                  condition:
                                    lambda: 'return id(cfg_ack) != 0;'
                                  timeout: 900ms
                              - lambda: |-
                                  if (id(cfg_ack) != 1 || uint16_t(id(cfg_rx_value)) != id(cfg_target)[id(cfg_step)]) {
                                    id(cfg_failed) = true;
                                  }
                                  id(cfg_phase) = 0;
                                  id(cfg_step)++;
                  - lambda: |-
                      // Exit verification session without any additional commit.
                      id(ep_exit) = 0;
                      static const uint8_t exit_without_save[2] = {0x00, 0x00};
                      id(bms0).send_command(0x5A, 0x01, exit_without_save, 2);
                  - wait_until:
                      condition:
                        lambda: 'return id(ep_exit) != 0;'
                      timeout: 3s
                  - lambda: |-
                      if (id(ep_exit) != 1) id(cfg_failed) = true;
            - lambda: |-
                char buf[145];
                if (id(cfg_failed)) {
                  snprintf(buf, sizeof(buf), "ERROR: read/write/verify failed. Check EEPROM before use; ACK %d", id(ep_exit));
                } else if (id(cfg_changed) == 0) {
                  snprintf(buf, sizeof(buf), "NO CHANGES: original 10/10 read; exit ACK");
                } else {
                  snprintf(buf, sizeof(buf), "SUCCESS: %d changed, commit ACK, 10/10 verified", id(cfg_changed));
                  id(eeprom_pack_ovp).publish_state(id(cfg_target)[0] / 100.0f);
                  id(eeprom_pack_ovpr).publish_state(id(cfg_target)[1] / 100.0f);
                  id(eeprom_pack_uvp).publish_state(id(cfg_target)[2] / 100.0f);
                  id(eeprom_pack_uvpr).publish_state(id(cfg_target)[3] / 100.0f);
                  id(eeprom_covp).publish_state(id(cfg_target)[4] / 1000.0f);
                  id(eeprom_covp_rel).publish_state(id(cfg_target)[5] / 1000.0f);
                  id(eeprom_cuvp).publish_state(id(cfg_target)[6] / 1000.0f);
                  id(eeprom_cuvp_rel).publish_state(id(cfg_target)[7] / 1000.0f);
                  id(eeprom_balance_start).publish_state(id(cfg_target)[8] / 1000.0f);
                  id(eeprom_balance_window).publish_state(id(cfg_target)[9] / 1000.0f);
                }
                id(cfg_status).publish_state(buf);
                id(cfg_busy) = false;
                id(ep_busy) = false;
                id(cfg_phase) = 0;
                id(cfg_unlock) = false;
                id(cfg_armed) = false;
          else:
            - lambda: 'id(cfg_status).publish_state("REFUSED: unlock, review and press Apply");'

