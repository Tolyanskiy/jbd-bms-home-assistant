            id(draft_validation_status).publish_state("REJECTED OVP Recovery: outside bounds or step");
            id(draft_covp_rel).publish_state(id(draft_covp_rel).state);
            return;
          }
          if (x > id(draft_covp).state - 0.05f + eps) {
            id(draft_validation_status).publish_state("REJECTED: OVP Recovery must be <= OVP - 0.05 V");
            id(draft_covp_rel).publish_state(id(draft_covp_rel).state);
            return;
          }
          id(draft_covp_rel).publish_state(x);
          id(saved_covp_rel) = x;
          id(draft_validation_status).publish_state("ACCEPTED OVP Recovery (DRAFT ONLY; NO WRITE)");
