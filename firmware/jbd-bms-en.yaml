  - platform: template
    name: "Compare EEPROM Draft (NO WRITE)"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          // Compare only a complete, freshly verified ten-register snapshot.
          if (id(ep_busy) || id(cfg_busy) || id(all_read_busy)) {
            id(draft_status).publish_state("WAIT: an EEPROM operation is running");
            return;
          }
          if (!id(all_read_valid) || id(all_read_mask) != 0x3FF || id(ep_exit) != 1) {
            id(draft_status).publish_state("READ FIRST: use 'Read All 10 EEPROM Parameters (No Save)'");
            return;
          }
          const float current[10] = {
            id(eeprom_pack_ovp).state, id(eeprom_pack_ovpr).state,
            id(eeprom_pack_uvp).state, id(eeprom_pack_uvpr).state,
            id(eeprom_covp).state, id(eeprom_covp_rel).state,
            id(eeprom_cuvp).state, id(eeprom_cuvp_rel).state,
            id(eeprom_balance_start).state, id(eeprom_balance_window).state
          };
          const float desired[10] = {
            id(draft_povp).state, id(draft_povpr).state,
            id(draft_puvp).state, id(draft_puvpr).state,
            id(draft_covp).state, id(draft_covp_rel).state,
            id(draft_cuvp).state, id(draft_cuvp_rel).state,
            id(draft_bal_start).state, id(draft_bal_delta).state
          };
          const char* labels[10] = {
            "Pack OVP", "Pack OVP Recovery", "Pack UVP", "Pack UVP Recovery",
            "Cell OVP", "Cell OVP Recovery", "Cell UVP", "Cell UVP Recovery",
            "Balance Start", "Balance Delta"
          };
          for (int i = 0; i < 10; ++i) {
            if (!std::isfinite(current[i]) || !std::isfinite(desired[i])) {
              id(draft_status).publish_state("INVALID DATA: reread all ten EEPROM parameters");
              return;
            }
          }
          int changed = 0;
          for (int i = 0; i < 10; ++i) {
            const float tolerance = (i < 4) ? 0.0051f : 0.00051f;
            const float diff = desired[i] - current[i];
            if (fabsf(diff) > tolerance) ++changed;
            ESP_LOGI("jbd_compare", "%s: EEPROM=%.3f V, DRAFT=%.3f V, delta=%+.3f V",
                     labels[i], current[i], desired[i], diff);
          }
          id(cmp_povp).publish_state(desired[0]-current[0]);
          id(cmp_povpr).publish_state(desired[1]-current[1]);
          id(cmp_puvp).publish_state(desired[2]-current[2]);
          id(cmp_puvpr).publish_state(desired[3]-current[3]);
          id(cmp_covp).publish_state(desired[4]-current[4]);
          id(cmp_covp_rel).publish_state(desired[5]-current[5]);
          id(cmp_cuvp).publish_state(desired[6]-current[6]);
          id(cmp_cuvp_rel).publish_state(desired[7]-current[7]);
          id(cmp_bal_start).publish_state(desired[8]-current[8]);
          id(cmp_bal_delta).publish_state(desired[9]-current[9]);
          char report[120];
          snprintf(report, sizeof(report), "DONE: 10/10 compared; %d differ, %d same. NO WRITE",
                   changed, 10-changed);
          id(draft_status).publish_state(report);
          ESP_LOGI("jbd_compare", "%s", report);

  # Re-check all accepted DRAFT fields; NO UART traffic.
  - platform: template
    name: "Validate DRAFT (NO WRITE)"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          const float ovp = id(draft_covp).state;
          const float ovpr = id(draft_covp_rel).state;
          const float uvp = id(draft_cuvp).state;
          const float uvpr = id(draft_cuvp_rel).state;
          const float bs = id(draft_bal_start).state;
          const float bd = id(draft_bal_delta).state;
          if (!(std::isfinite(ovp) && std::isfinite(ovpr) &&
                std::isfinite(uvp) && std::isfinite(uvpr) &&
                std::isfinite(bs) && std::isfinite(bd))) {
            id(draft_validation_status).publish_state("INVALID: one or more numbers unavailable");
          } else if (ovp - ovpr < 0.0495f || ovp - bs < 0.0495f) {
            id(draft_validation_status).publish_state("INVALID: OVP must exceed Recovery and Balance Start by 0.05 V");
          } else if (uvpr - uvp < 0.0995f) {
            id(draft_validation_status).publish_state("INVALID: UVP Recovery must exceed UVP by 0.10 V");
          } else {
            id(draft_validation_status).publish_state("VALID DRAFT: logical limits OK; NO EEPROM WRITE");
          }

  - platform: template
    name: "Reset DRAFT to Recommended (NO WRITE)"
    entity_category: config
    on_press:
      - lambda: |-
          if (!id(cfg_unlock)) {
            id(draft_validation_status).publish_state("LOCKED - cannot reset draft");
            return;
          }
          id(cfg_armed) = false;
          // Only local ESPHome number states; these are not JBD parameters.
          id(draft_povp).publish_state(${project_povp}f);
          id(saved_povp) = ${project_povp}f;
          id(draft_povpr).publish_state(${project_povpr}f);
          id(saved_povpr) = ${project_povpr}f;
          id(draft_puvp).publish_state(${project_puvp}f);
          id(saved_puvp) = ${project_puvp}f;
          id(draft_puvpr).publish_state(${project_puvpr}f);
          id(saved_puvpr) = ${project_puvpr}f;
          id(draft_covp).publish_state(${project_covp}f);
          id(saved_covp) = ${project_covp}f;
          id(draft_covp_rel).publish_state(${project_covp_rel}f);
          id(saved_covp_rel) = ${project_covp_rel}f;
          id(draft_cuvp).publish_state(${project_cuvp}f);
          id(saved_cuvp) = ${project_cuvp}f;
          id(draft_cuvp_rel).publish_state(${project_cuvp_rel}f);
          id(saved_cuvp_rel) = ${project_cuvp_rel}f;
          id(draft_bal_start).publish_state(${project_bal_start}f);
          id(saved_bal_start) = ${project_bal_start}f;
          id(draft_bal_delta).publish_state(${project_bal_delta}f);
          id(saved_bal_delta) = ${project_bal_delta}f;
          id(draft_validation_status).publish_state("RESET: recommended DRAFT restored; NO EEPROM WRITE");

  - platform: template
    name: "Review and ARM Configuration (60s)"
    entity_category: config
    on_press:
      - lambda: |-
          id(cfg_armed) = false;
          if (!id(cfg_unlock) || id(cfg_busy) || id(ep_busy)) {
            id(cfg_status).publish_state("REFUSED: unlock needed or transaction busy");
            return;
          }
          if (!id(bms_online_status).state || id(bms_afe_error).state ||
              !std::isfinite(id(bms_measured_current).state) ||
              fabsf(id(bms_measured_current).state) > 0.1f) {
            id(cfg_status).publish_state("REFUSED: BMS offline/AFE error/current > 0.1 A");
            return;
          }
          const float p_ov = id(draft_povp).state;
          const float p_ovr = id(draft_povpr).state;
          const float p_uv = id(draft_puvp).state;
          const float p_uvr = id(draft_puvpr).state;
          const float c_ov = id(draft_covp).state;
          const float c_ovr = id(draft_covp_rel).state;
          const float c_uv = id(draft_cuvp).state;
          const float c_uvr = id(draft_cuvp_rel).state;
          const float bal = id(draft_bal_start).state;
          const float dbal = id(draft_bal_delta).state;
          const float a[] = {p_ov,p_ovr,p_uv,p_uvr,c_ov,c_ovr,c_uv,c_uvr,bal,dbal};
          for (auto v: a) if (!std::isfinite(v)) {
            id(cfg_status).publish_state("REFUSED: missing or invalid number"); return;
          }
          if (p_ov < 14.00f || p_ov > 14.6001f || p_ovr > p_ov - 0.19f ||
              p_uv < 10.00f || p_uv > 10.90f || p_uvr < p_uv + 0.29f ||
              c_ov > 3.6501f || c_ov < 3.50f || c_ovr > c_ov - 0.05f ||
              c_uv < 2.50f || c_uv > 2.75f || c_uvr < c_uv + 0.10f ||
              p_ov > 4.0f * c_ov + 0.01f ||
              p_uv < 4.0f * c_uv - 0.01f ||
              bal > c_ov - 0.05f || dbal < 0.010f || dbal > 0.040f) {
            id(cfg_status).publish_state("REFUSED: unsafe pack/cell thresholds or recovery relation");
            return;
          }
          id(cfg_armed) = true;
          id(cfg_status).publish_state("ARMED 60 seconds. PRESS APPLY to write EEPROM; backup first");
      - delay: 60s
      - lambda: |-
          id(cfg_armed) = false;
          if (id(cfg_unlock)) id(cfg_status).publish_state("ARM timeout - review again");
  - platform: template
    name: "APPLY Configuration to JBD EEPROM (BENCH ONLY)"
    entity_category: config
    on_press:
      - if:
          condition:
            lambda: 'return id(cfg_unlock) && id(cfg_armed) && !id(cfg_busy) && !id(ep_busy);'
          then:
            - script.execute: cfg_write_transaction
          else:
            - lambda: 'id(cfg_status).publish_state("REFUSED - LOCKED / not armed / busy");'


# Control gates: OFF after every reboot; no automatic EEPROM writes.
switch:
  - platform: template
    name: "UNLOCK JBD Config Editing (BENCH ONLY)"
    id: cfg_control
    entity_category: config
    lambda: 'return id(cfg_unlock);'
    turn_on_action:
      - lambda: |-
          if (id(cfg_busy) || id(ep_busy)) return;
          id(cfg_unlock) = true;
          id(cfg_armed) = false;
          id(cfg_status).publish_state("UNLOCKED: editing allowed; ARM then APPLY. DO NOT connect UPS");
    turn_off_action:
      - lambda: |-
          id(cfg_unlock) = false;
          id(cfg_armed) = false;
          id(cfg_status).publish_state("LOCKED - no EEPROM write allowed");

  # JBD discharge MOSFET control (independent of the EEPROM editing lock).
  - platform: jbd_bms
    jbd_bms_id: bms0
    discharging:
      name: "Discharge MOSFET Control"
      id: jbd_discharge_mosfet_control
