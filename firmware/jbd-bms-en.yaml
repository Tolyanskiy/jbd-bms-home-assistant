              !std::isfinite(x) || x < 2.500f - 0.0005f ||
              x > 2.750f + 0.0005f ||
              fabsf((x - 2.500f) / 0.010f - roundf((x - 2.500f) / 0.010f)) > 0.015f) {
            id(profile_status).publish_state("Invalid value or another operation is running");
            return;
