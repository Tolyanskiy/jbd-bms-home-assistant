        columns: full
        rows: auto
  - type: grid
    title: Project Profile
    cards:
    - type: entities
      title: Project Defaults · Read Only
      show_header_toggle: false
      entities:
      - entity: sensor.jbd_bms_profile_project_pack_overvoltage
        name: Pack · OVP
      - entity: sensor.jbd_bms_profile_project_pack_ovp_recovery
        name: Pack · OVP Recovery
      - entity: sensor.jbd_bms_profile_project_pack_undervoltage
        name: Pack · UVP
      - entity: sensor.jbd_bms_profile_project_pack_uvp_recovery
        name: Pack · UVP Recovery
      - entity: sensor.jbd_bms_profile_project_cell_overvoltage
        name: Cells · OVP
      - entity: sensor.jbd_bms_profile_project_cell_ovp_recovery
        name: Cells · OVP Recovery
      - entity: sensor.jbd_bms_profile_project_cell_undervoltage
