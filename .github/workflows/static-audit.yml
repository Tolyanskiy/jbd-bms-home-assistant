name: Static audit

on:
  push:
  pull_request:

jobs:
  yaml-and-references:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python -m pip install 'PyYAML>=6.0,<7.0'
      - name: Check YAML variants, entities and secrets
        run: python tools/static_audit.py
